# 银星智创平台 · 云服务器示例配置（Ubuntu：放置到 /etc/nginx/sites-available/yxny 并软链启用）
# 关键点：
#   ① 站点与 AI 接口同源（/ai/...）→ 规避 https 页面调 http 接口的混合内容拦截与跨域问题
#   ② 中台 Key 只写在这里（服务器端），浏览器网页里永远看不到
server {
    listen 80;
    server_name _;

    root /var/www/yxny;          # 解压后的目录（含 index.html / workbench/）
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # AI：把 /ai/v1/... 转发到中铝坤安 AI 中台（SSE 流式必须关闭缓冲）
    location /ai/ {
        proxy_pass http://api.chinalco.com.cn/aimiddle/;
        proxy_http_version 1.1;
        proxy_set_header Host api.chinalco.com.cn;
        proxy_set_header Connection "";
        proxy_set_header Authorization "Bearer 这里换成你的中台Key";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 可选：全站账号密码（防止外人浏览、防止 AI 额度被无关人员消耗）
    # 创建：sudo apt install -y apache2-utils && sudo htpasswd -c /etc/nginx/.htpasswd demo
    # 启用：去掉下面两行注释
    # auth_basic "银星智创平台演示";
    # auth_basic_user_file /etc/nginx/.htpasswd;
}
